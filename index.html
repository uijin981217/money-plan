<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F2E8">
<meta name="description" content="직장인을 위한 개인 재무설계 앱: 월급·절세·보험·노후 플랜을 한곳에서. 로그인 없이 내 폰에만 저장돼요.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="재무플랜">
<title>평생 재무플랜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Hahmlet:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 통장 한 권처럼 좁은 단일 칼럼 + 하단 탭바. 숫자는 장부식 고정폭. */
:root{
  --bg:#F6F7F9; --surface:#FFFFFF; --line:#E4E7ED; --fg:#1E2431; --muted:#6B7386;
  --accent:#5672C4; --accent-soft:#EDF0FA; --stamp:#C9806B;
  --good:#3F8A67; --good-soft:#E8F3ED; --warn:#A97B34; --warn-soft:#F8F0E2; --crit:#BC5A4E; --crit-soft:#F8EAE7;
  --c-tax:#B7BDC8; --c-fixed:#E6C38F; --c-var:#EBAFA3; --c-save:#9DB0E6; --c-left:#9CCDB2; --c-prop:#C9C3D9;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151C; --surface:#191E28; --line:#2B3240; --fg:#E6E9EF; --muted:#9AA2B3;
  --accent:#93A6E6; --accent-soft:#232B42; --stamp:#E0A08D;
  --good:#86C4A2; --good-soft:#1A2B23; --warn:#DDB57A; --warn-soft:#2E2618; --crit:#E39689; --crit-soft:#33201D;
  --c-tax:#5D6575; --c-fixed:#A88C61; --c-var:#AE7E75; --c-save:#7085C0; --c-left:#6A9D82; --c-prop:#857F96; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151C; --surface:#191E28; --line:#2B3240; --fg:#E6E9EF; --muted:#9AA2B3;
  --accent:#93A6E6; --accent-soft:#232B42; --stamp:#E0A08D;
  --good:#86C4A2; --good-soft:#1A2B23; --warn:#DDB57A; --warn-soft:#2E2618; --crit:#E39689; --crit-soft:#33201D;
  --c-tax:#5D6575; --c-fixed:#A88C61; --c-var:#AE7E75; --c-save:#7085C0; --c-left:#6A9D82; --c-prop:#857F96; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 120px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px 4px}
.brand{font-weight:700;font-size:18px;letter-spacing:-.01em}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.save{font-size:12px;color:var(--muted);text-align:right}
.setup-actions{display:grid;grid-template-columns:1fr 2fr;gap:8px}
.setup-actions .btn{padding:12px}
.fchips{display:flex;flex-wrap:wrap;gap:8px}
.fchip{font:inherit;font-size:14px;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.autorow{font:inherit;width:100%;background:var(--bg);border:0;border-radius:8px;padding:8px 10px!important;color:var(--fg);cursor:pointer;display:flex;justify-content:space-between}
.autorow .note{color:var(--accent)}
.top-r{display:grid;justify-items:end;gap:4px}
.modechip{font:inherit;font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);border:0;border-radius:99px;padding:3px 10px;cursor:pointer;white-space:nowrap}
.modechip.empty{background:transparent;border:1px dashed var(--accent)}
.save b{font-weight:600;color:var(--fg)}
h2{font-size:20px;margin:18px 0 4px;text-wrap:balance;letter-spacing:-.01em}
h3{font-size:15px;margin:0 0 8px}
.lead{color:var(--muted);margin:0 0 14px;font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;min-width:0}
.stack{display:grid;gap:12px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.big{font-size:30px;font-weight:600;line-height:1.15}
.label{font-size:12px;color:var(--muted);letter-spacing:.02em}
.row{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.row > span:last-child{text-align:right}
.rows{display:grid;gap:6px;font-size:14px}
.rows .row.total{border-top:1px solid var(--line);padding-top:8px;font-weight:600}
.minus{color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--bg);border-radius:10px;padding:10px 12px;min-width:0}
.kpi .v{font-size:18px;font-weight:600}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warn-soft);color:var(--fg);border-radius:12px;padding:10px 12px;font-size:13px}
.banner b{color:var(--warn)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.todo{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.todo li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:14px}
.dot{width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--accent)}
.dot.warn{background:var(--warn)} .dot.crit{background:var(--crit)} .dot.good{background:var(--good)}
.bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--c-save);border-radius:99px}
.bar.good > i{background:var(--c-left)} .bar.warn > i{background:var(--c-fixed)} .bar.crit > i{background:var(--c-var)}
.score{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:92px;height:92px}
.stamp{display:inline-block;border:2px solid var(--stamp);color:var(--stamp);font-weight:700;border-radius:6px;padding:0 6px;font-size:12px;transform:rotate(-4deg)}
/* forms */
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.field{display:grid;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inp{display:flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:0 10px;min-width:0}
.inp:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inp input,.inp select{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:inherit;font-family:var(--f-num);padding:9px 0;outline:none;width:100%}
.inp select{font-family:var(--f-body)}
.inp input[type=text]{font-family:var(--f-body)}
.inp .u{font-size:12px;color:var(--muted);padding-left:6px;white-space:nowrap}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0E121A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0E121A}}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding:6px 4px}
.btn.del{border-color:transparent;background:transparent;color:var(--muted);padding:4px 6px}
.btn:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
details summary{cursor:pointer;color:var(--accent);font-size:14px;font-weight:500}
.list{display:grid;gap:10px}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px}
.item-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.note{font-size:12px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.policy{display:grid;gap:6px;padding-block:12px;border-top:1px solid var(--line)}
.policy:first-of-type{border-top:0;padding-top:0}
.policy .row{align-items:center;flex-wrap:wrap}
.policy .row > span:last-child{white-space:nowrap}
.policy p{margin:0;font-size:14px;color:var(--muted)}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.chips.small{display:flex;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:10px 12px;text-align:left;display:grid;gap:2px;font-size:14px;min-width:0}
.chip span{font-size:12px;color:var(--muted);line-height:1.4}
.chips.small .chip{padding:6px 10px;border-radius:99px;font-size:13px;color:var(--accent);font-weight:500}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.chip[aria-pressed="true"] b{color:var(--accent)}
.card p{margin:0}
.erow.erow4{grid-template-columns:minmax(0,1fr) 84px 68px 22px;gap:5px}
.linkpill{overflow:hidden;text-overflow:ellipsis;padding-inline:6px!important}
.linkpill{font:inherit;font-size:11.5px;font-weight:600;white-space:nowrap;padding:5px 8px;border-radius:99px;border:1px dashed transparent;background:transparent;color:var(--muted);opacity:.75;cursor:pointer}
.linkpill:hover{border-color:var(--line);opacity:1}
.linkpill.on{opacity:1}
.linkpill.on{border:1px solid transparent;background:var(--accent-soft);color:var(--accent)}
.acclist{display:grid;gap:10px}
.ratelink{display:flex;align-items:center;gap:10px;white-space:nowrap}
.ratelink .note{overflow:hidden;text-overflow:ellipsis}
.todo li{display:block}
.td summary{display:flex;align-items:center;gap:10px;list-style:none;cursor:pointer;padding-block:6px;color:var(--fg)}
.td summary::-webkit-details-marker{display:none}
.td-t{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14.5px;min-width:0}
.td-v{margin-left:auto;font-size:13.5px;color:var(--accent);white-space:nowrap}
.td summary::after{content:"›";color:var(--muted);font-size:16px;transition:transform .2s}
.td[open] summary::after{transform:rotate(90deg)}
.td p{padding:0 0 8px;margin:0}
.todo li + li{border-top:1px solid var(--line)}
.todo{gap:0!important}
.td-due{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--c-var);flex:none}
.brow{display:grid;grid-template-columns:minmax(0,1fr) auto auto 22px;gap:8px;align-items:center;padding-block:8px;border-bottom:1px solid var(--line)}
.bbody .brow:last-of-type{border-bottom:0}
.brow.brow3{grid-template-columns:minmax(0,1fr) auto 22px}
.bamt.wide input{width:84px}
.bname{font:inherit;font-size:14.5px;color:var(--fg);background:none;border:0;padding:4px 0;text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bname.empty{color:var(--accent)}
.bname:hover{color:var(--accent)}
.bamt{display:flex;align-items:baseline;gap:2px;border-bottom:1px dashed var(--line);padding-bottom:1px}
.bamt:focus-within{border-bottom-color:var(--accent)}
.bamt input{width:52px;border:0;background:transparent;color:var(--fg);font-family:var(--f-num);font-size:15px;font-weight:600;text-align:right;padding:2px 0;outline:none}
.bamt input::-webkit-outer-spin-button,.bamt input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.bamt input{-moz-appearance:textfield}
.bamt span{font-size:12px;color:var(--muted)}
.brow .linkpill{opacity:1;border:1px solid var(--line);color:var(--muted)}
.brow .linkpill.on{border-color:transparent}
.sheet-wrap{position:fixed;inset:0;z-index:50}
.sheet-bg{position:absolute;inset:0;background:color-mix(in srgb,var(--fg) 35%,transparent)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:600px;margin:0 auto;background:var(--surface);border-radius:18px 18px 0 0;padding:14px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px));max-height:80vh;overflow:auto;box-shadow:0 -8px 30px rgba(0,0,0,.12)}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.optlist{display:grid;gap:6px}
.opt{font:inherit;text-align:left;display:grid;gap:2px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.opt span{font-size:12.5px;color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.chipgrid{display:flex;flex-wrap:wrap;gap:8px}
.chipopt{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:99px;font-size:14px}
.minitag{font-size:11px!important;color:var(--accent)!important;background:var(--accent-soft);border-radius:99px;padding:1px 6px}
.custom{display:flex;gap:8px;margin-top:12px}
.custom input{flex:1;min-width:0;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.verdict{gap:14px;transition:background .2s}
.verdict[data-v="good"]{background:var(--good-soft);border-color:transparent}
.verdict[data-v="warn"]{background:var(--warn-soft);border-color:transparent}
.verdict[data-v="crit"]{background:var(--crit-soft);border-color:transparent}
.v-top{display:flex;align-items:center;gap:14px}
.light{display:flex;flex-direction:column;gap:4px;padding:6px;border-radius:99px;background:var(--surface)}
.light i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.light i:nth-child(1).on{background:var(--c-var)} .light i:nth-child(2).on{background:var(--c-fixed)} .light i:nth-child(3).on{background:var(--c-left)}
.v-head{display:grid;gap:2px}
.v-lab{font-size:22px;letter-spacing:-.01em}
.verdict[data-v="good"] .v-lab{color:var(--good)} .verdict[data-v="warn"] .v-lab{color:var(--warn)} .verdict[data-v="crit"] .v-lab{color:var(--crit)}
.v-why{margin:0;font-size:14px}
.jtiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.jt{background:var(--surface);border-radius:12px;padding:10px 12px;display:grid;gap:1px}
.jt b{font-size:18px}
.jt .note{font-size:11.5px}
.wishbtn{width:100%;background:var(--surface);border-color:transparent;color:var(--accent);font-weight:600}
.wishlist{display:grid}
.wish-d{border-top:1px solid var(--line)}
.wish-d:first-child{border-top:0}
.wish-d summary{display:flex;align-items:center;gap:10px;padding-block:10px;list-style:none;cursor:pointer;color:var(--fg)}
.wish-d summary::-webkit-details-marker{display:none}
.wn{display:grid;min-width:0;flex:1}
.wn .note{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wdot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--line)}
.wdot.good{background:var(--c-left)} .wdot.warn{background:var(--c-fixed)} .wdot.crit{background:var(--c-var)}
.wv{font-size:12.5px;font-weight:600;white-space:nowrap}
.wv.good{color:var(--good)} .wv.warn{color:var(--warn)} .wv.crit{color:var(--crit)}
.wbody{display:grid;gap:8px;padding:0 0 12px 18px}
.wgrid{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px}
.wgrid span{color:var(--muted)} .wgrid b{text-align:right}
.acc{border-bottom:1px solid var(--line);padding-block:8px}
.acc summary{display:flex;justify-content:space-between;align-items:center;gap:10px;list-style:none;cursor:pointer;color:var(--fg)}
.acc summary::-webkit-details-marker{display:none}
.acc-t{display:grid;line-height:1.35}
.acc-t .note{font-size:12px}
.acc[open] summary{margin-bottom:4px}
.acc .pill{font-weight:500}
.acc .num{white-space:nowrap}
.linkrow{display:flex;align-items:center;gap:6px;margin:-2px 0 4px 8px}
.linksel{font:inherit;font-size:12px;color:var(--muted);background:transparent;border:1px dashed var(--line);border-radius:99px;padding:2px 8px}
.linksel:focus{outline:2px solid var(--accent-soft);color:var(--fg)}
.fields{align-items:start}
.autohint{font-size:11.5px;color:var(--accent);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.field.is-auto .inp{background:var(--accent-soft);border-style:dashed}
.chkgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 10px}
.chkgrid .check{font-size:13.5px}
.loanrow{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:grid;gap:2px;width:100%;text-align:left;background:var(--surface);color:var(--fg);font:inherit;cursor:pointer}
.loanrow:not(:disabled):hover{border-color:var(--accent)}
.loanrow:disabled{cursor:not-allowed}
.loanrow.best{border-color:var(--good);background:var(--good-soft)}
.loanrow.no{opacity:.6}
details.sec{gap:0}
details.datacard > summary,details.sec > summary{display:flex;align-items:center;gap:8px;list-style:none;cursor:pointer;color:var(--fg)}
details.datacard > summary::-webkit-details-marker,details.sec > summary::-webkit-details-marker{display:none}
details.datacard > summary{font-weight:700;font-size:15px}
details.datacard > summary::after{content:"›";margin-left:auto;color:var(--muted);font-size:20px;line-height:1;transition:transform .2s}
details.datacard[open] > summary::after{transform:rotate(90deg)}
details.sec > summary .sec-t{font-weight:700;font-size:15px}
details.sec > summary .sec-b{margin-left:auto}
details.sec > summary::after{content:"›";color:var(--muted);font-size:20px;line-height:1;transition:transform .2s}
details.sec[open] > summary::after{transform:rotate(90deg)}
details.sec > .secbody{display:grid;gap:12px;margin-top:14px}
.golink{justify-self:start;font-size:13px;font-weight:500;color:var(--accent);text-decoration:none;padding:4px 10px;border-radius:99px;background:var(--accent-soft)}
.golink:hover{text-decoration:underline}
.fields.three{grid-template-columns:repeat(3,minmax(0,1fr))!important}
.evlist{display:grid;border-top:1px solid var(--line)}
.evlist .bgroup:first-child summary{border-top:0}
.evname{white-space:nowrap}
.evyear{display:inline-block;font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 6px;margin-right:2px}
.evitem summary{grid-template-columns:auto minmax(0,1fr) 0}
.evitem summary .note{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evitem .bbody{padding-left:0}
.evadd{justify-self:start;border-style:dashed;color:var(--accent);background:transparent}
.evpick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.evpick .chip{padding:10px 6px;text-align:center;font-size:13px}
.ytbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;table-layout:fixed}
.ytbl th{font-weight:500;color:var(--muted);text-align:right;padding:6px 4px;border-bottom:1px solid var(--line);font-size:12px}
.ytbl th:first-child,.ytbl td:first-child{text-align:left;width:46%}
.ytbl td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
.ytbl tr.ev td{background:var(--accent-soft)}
.ytbl .tag{font-size:11.5px;color:var(--accent);margin-top:2px}
.ytbl .neg{color:var(--crit)}
.flowlist{display:grid}

.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border-top:1px solid var(--line);padding-top:12px}

.card.tight{padding-block:12px}
.todo li[hidden]{display:none}

.fgrid{display:grid;gap:8px}
.fcard{padding:14px 16px;gap:0}
.fcard summary{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;list-style:none;cursor:pointer}
.fcard summary::-webkit-details-marker{display:none}
.fcard summary,details.datacard summary{color:var(--fg)}
.fcard .ft{font-weight:600;font-size:15px}
.fcard .fk{display:grid;justify-items:end;line-height:1.3}

.fcard summary::after{content:"›";grid-column:2;justify-self:end;display:none}
.fcard .fbody{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.fcard[open]{border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}

details.datacard summary{font-weight:600;cursor:pointer}

.agroup{display:grid;gap:4px;padding-top:10px;border-top:1px solid var(--line)}
.ghead{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:14px}
.ghead span:first-child{display:flex;align-items:center;gap:8px}
.irow{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;color:var(--muted);padding-left:18px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.sw-cash{background:var(--c-left)} .sw-invest{background:var(--c-save)} .sw-pension{background:var(--c-fixed)} .sw-property{background:var(--c-prop)} .sw-debt{background:var(--c-var)} .sw-right{background:var(--c-fixed);opacity:.6} .sw-car{background:var(--c-tax)} .sw-etc{background:var(--c-prop);opacity:.6}
.cbar{display:flex;height:10px;border-radius:99px;overflow:hidden;gap:2px;background:var(--bg)}

.erow{display:grid;grid-template-columns:minmax(0,1fr) 128px 28px;gap:6px;align-items:center}

.ein{display:flex;align-items:center;padding-right:8px}
.ein input{flex:1;min-width:0;width:100%;border:0;background:transparent;color:var(--fg);font-family:var(--f-num);font-size:14px;padding:7px 0 7px 10px;outline:none;text-align:right}
.ein .u{font-size:11.5px;color:var(--muted);padding-left:4px}
.erow > input:focus,.ein:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.xbtn{border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;width:28px;height:32px;border-radius:8px}

.addrow{justify-self:start;font-size:13px;padding:2px 0}
.tiers{display:grid;gap:6px}
.tier{border-radius:10px;padding:8px 10px;background:var(--bg)}
.tier.on{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
details.tip summary{color:var(--accent);font-weight:500;font-size:14px}

.draft-row{align-items:flex-start;border-top:1px solid var(--line);padding-top:8px}
.draft-row input{margin-top:3px}

.hero-num{display:grid;gap:2px}
.chart-wrap{overflow-x:auto;margin-inline:-4px}
.fields.compact{gap:8px}
.fields.compact .inp input{padding-block:7px}

details.nps summary::-webkit-details-marker{display:none}

@media (max-width:420px){.card{padding:14px;gap:10px}h2{font-size:19px}.big{font-size:26px}}
.wish-load{flex:1;min-width:0;text-align:left;background:transparent;border:0;color:var(--fg);padding:6px 0;font-size:14px}
.wish-load:hover b{color:var(--accent)}
.btn.ghost[data-go]{justify-self:start}
.mode .btn{white-space:nowrap}
.mode{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:4px}
.mode-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.card.focus{border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.buycta{display:flex!important;justify-content:space-between;align-items:center;text-align:left;color:var(--fg);font-size:15px;width:100%}
.buycta > span:last-child{font-size:22px;color:var(--accent)}
.legend{display:flex;gap:16px}
.lg{display:inline-block;width:18px;height:0;border-top:2.5px solid var(--accent);vertical-align:middle;margin-right:6px}

.tbl{border-collapse:collapse;font-size:12.5px;white-space:nowrap;margin-top:8px}

.tbl th:first-child,.tbl td:first-child,.tbl td:last-child,.tbl th:last-child{text-align:left}
.tbl th{color:var(--muted);font-weight:500}
@media (max-width:380px){.chips{grid-template-columns:1fr}}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tab{border:0;background:transparent;color:var(--muted);padding:8px 2px 10px;display:grid;justify-items:center;gap:2px;font-size:11.5px;font-weight:500}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--accent)}
.tab[aria-selected="true"] span{font-weight:700}
section.view{display:grid;gap:14px}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:99px;font-size:13px;z-index:30}
@media (max-width:380px){.fields:not(.compact){grid-template-columns:1fr}.big{font-size:26px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* ===== v4 통일 레이어: 접기·입력·상단·동작 ===== */
/* 상단 바 고정 */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--bg)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px)) 8px;border-bottom:1px solid transparent}
.brand{font-size:17px}
.save{display:flex;align-items:center;gap:4px;font-size:11.5px}
.save svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.save .saving{color:var(--accent)}
.banner{padding:8px 12px;font-size:12.5px;gap:6px;background:var(--warn-soft)}
.banner .btn{padding:2px 0;font-size:12.5px}
/* 탭 상단: 제목만 */
section.view > .lead{display:none}
section.view > h2{font-size:22px;margin:6px 0 0}
/* 카드 공통 */
.card{border-radius:16px;padding:16px}
.card.hero{background:var(--surface)}
/* 접기 통일: 모든 summary = 글자 + 오른쪽 › (펼치면 아래로) */
details > summary{list-style:none}
details > summary::-webkit-details-marker{display:none}
details.more > summary,details.tip > summary,details.nps > summary{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500;color:var(--fg);padding-block:2px;cursor:pointer}
details.more > summary::after,details.tip > summary::after{content:"›";margin-left:auto;color:var(--muted);font-size:18px;line-height:1;transition:transform .2s}
details.more[open] > summary::after,details.tip[open] > summary::after{transform:rotate(90deg)}
details.nps > summary::after{margin-left:6px}
.bgroup summary span:first-child::after{content:none!important}
.bgroup summary{grid-template-columns:minmax(0,1fr) auto 44px 14px!important}
.bgroup > summary::after{content:"›";color:var(--muted);font-size:16px;transition:transform .2s;justify-self:end}
.bgroup[open] > summary::after{transform:rotate(90deg)}
.evitem summary{grid-template-columns:auto minmax(0,1fr) 0 14px!important}
.insitem summary{grid-template-columns:minmax(0,1fr) auto 0 14px!important}
.fcard summary{grid-template-columns:minmax(0,1fr) auto 14px!important}
.fcard summary::after{content:"›"!important;display:block!important;grid-column:3!important;color:var(--muted);transition:transform .2s}
.fcard[open] summary::after{transform:rotate(90deg)}
.acc summary::after,.wish-d summary::after{content:"›";color:var(--muted);font-size:16px;transition:transform .2s;margin-left:4px}
.acc[open] summary::after,.wish-d[open] summary::after{transform:rotate(90deg)}
details.sec > summary::after,details.datacard > summary::after{font-size:18px}
/* 펼칠 때 부드럽게 */
details[open] > :not(summary){animation:fadeIn .18s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
/* 입력 통일: 박스 없이 밑줄 */
.inp{background:transparent;border:0;border-bottom:1px dashed var(--line);border-radius:0;padding:0 2px}
.inp:focus-within{box-shadow:none;border-bottom:1.5px solid var(--accent)}
.inp input,.inp select{padding:6px 0;font-size:15px;font-weight:600}
.inp input[type=text]{font-weight:500}
.inp input::-webkit-outer-spin-button,.inp input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.inp input[type=number]{-moz-appearance:textfield}
.field.is-auto .inp{background:transparent;border-bottom-style:solid;border-bottom-color:var(--accent-soft)}
.field.is-auto .inp input{color:var(--accent)}
.fields{gap:12px 14px}
.erow > input,.ein{background:transparent;border:0;border-bottom:1px dashed var(--line);border-radius:0}
.erow > input:focus,.ein:focus-within{box-shadow:none;border-bottom:1.5px solid var(--accent)}
textarea{background:var(--bg)}
/* 눌림 효과 */
button,.tab,summary,label.btn{-webkit-tap-highlight-color:transparent}
.btn:active,.chip:active,.fchip:active,.opt:active,.loanrow:not(:disabled):active,.buycta:active,.autorow:active{transform:scale(.97)}
summary:active{opacity:.7}
.btn,.chip,.fchip,.opt,.loanrow,.buycta{transition:transform .08s ease,background .15s,border-color .15s}
/* 탭바 */
nav.tabs{background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.tab{position:relative;padding-top:10px}
.tab[aria-selected="true"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2.5px;border-radius:0 0 3px 3px;background:var(--accent)}
.tab:active svg{transform:scale(.9)}
/* 탭 전환 */
section.view.enter{animation:rise .22s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* 시트 열림 */
.sheet{animation:sheetUp .22s ease-out}
.sheet-bg{animation:fadeOnly .2s ease-out}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes fadeOnly{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){section.view.enter,details[open] > :not(summary),.sheet,.sheet-bg{animation:none}}

/* 3분 시작 */
.quick{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;min-height:calc(100dvh - 220px);align-content:start}
.qtop{display:flex;justify-content:space-between;align-items:center}
.qprog{display:grid;grid-auto-flow:column;gap:4px}

.qinput{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--accent);padding:6px 2px;margin-top:8px}
.qinput input{flex:1;min-width:0;width:100%;border:0;background:transparent;color:var(--fg);font-family:var(--f-num);font-size:34px;font-weight:600;outline:none;padding:0}
.qinput input::-webkit-outer-spin-button,.qinput input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.qinput span{color:var(--muted);font-size:15px}
.qinput.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.qhint{font-size:14px;color:var(--muted);min-height:20px}
.qhint b{color:var(--fg)}
.qguess{justify-self:start;padding:4px 0}
.qnext{padding:14px;font-size:16px;margin-top:8px}
body.in-quick nav.tabs{display:none}
body.in-quick .top-r{visibility:hidden}

/* ===== v5 플래너·다이어리 레이어 ===== */
:root{
  --bg:#F7F2E8; --surface:#FFFDF8; --line:#E7DECD; --fg:#3A3229; --muted:#8A7F70;
  --accent:#4F6D8F; --accent-soft:#E9EEF3; --stamp:#C77A5E;
  --good:#5E8C6A; --good-soft:#E8F0E3; --warn:#B08A3E; --warn-soft:#F6ECD6; --crit:#BF6B57; --crit-soft:#F6E4DD;
  --c-tax:#C9C0B2; --c-fixed:#E9C98F; --c-var:#E8B2A0; --c-save:#A9BBD6; --c-left:#B4CFA6; --c-prop:#CDBFD8;

  --good:#9CC4A4; --good-soft:#232B22; --warn:#DDBB7A; --warn-soft:#332B1C; --crit:#E5A08E; --crit-soft:#3A2520;
  --c-tax:#6B6358; --c-fixed:#A88D5E; --c-var:#A97A6C; --c-save:#6F84A3; --c-left:#7A9970; --c-prop:#857A91;
  --hl:rgba(221,187,122,.35); --tape:rgba(200,160,90,.35); --dot:rgba(236,228,214,.07)}}

  --good:#9CC4A4; --good-soft:#232B22; --warn:#DDBB7A; --warn-soft:#332B1C; --crit:#E5A08E; --crit-soft:#3A2520;

<script>
// ===== 2026년 기준값 (2026 귀속, 2027년 초 연말정산) =====
const RULES = {
  year: 2026,
  nps: { rate: 0.0475, cap: 6590000, floor: 410000 },      // 2026.7~2027.6
  health: 0.03595,
  ltcOfHealth: 0.1314,
  employment: 0.009,
  basicPerPerson: 1500000,
  brackets: [ // [상한, 세율, 누진공제]
    [14000000, 0.06, 0],
    [50000000, 0.15, 1260000],
    [88000000, 0.24, 5760000],
    [150000000, 0.35, 15440000],
    [300000000, 0.38, 19940000],
    [500000000, 0.40, 25940000],
    [1000000000, 0.42, 35940000],
    [Infinity, 0.45, 65940000],
  ],
  pension: { savingsCap: 6000000, totalCap: 9000000, lowRate: 0.15, highRate: 0.12, threshold: 55000000 },
  standardCredit: 130000,
};

const r10 = v => Math.floor(v / 10) * 10;

function earnedIncomeDeduction(g) {
  let d;
  if (g <= 5e6) d = g * 0.7;
  else if (g <= 15e6) d = 3.5e6 + (g - 5e6) * 0.4;
  else if (g <= 45e6) d = 7.5e6 + (g - 15e6) * 0.15;
  else if (g <= 100e6) d = 12e6 + (g - 45e6) * 0.05;
  else d = 14.75e6 + (g - 100e6) * 0.02;
  return Math.min(d, 20e6);
}

function socialInsurance(monthlyTaxable) {
  if (!(monthlyTaxable > 0)) return { nps: 0, health: 0, ltc: 0, emp: 0, total: 0 };
  const npsBase = Math.min(Math.max(monthlyTaxable, RULES.nps.floor), RULES.nps.cap);
  const nps = r10(npsBase * RULES.nps.rate);
  const health = r10(monthlyTaxable * RULES.health);
  const ltc = r10(health * RULES.ltcOfHealth);
  const emp = r10(monthlyTaxable * RULES.employment);
  return { nps, health, ltc, emp, total: nps + health + ltc + emp };
}

function progressiveTax(base) {
  if (base <= 0) return 0;
  for (const [cap, rate, sub] of RULES.brackets) if (base <= cap) return Math.max(0, base * rate - sub);
  return 0;
}
function marginalRate(base) {
  for (const [cap, rate] of RULES.brackets) if (base <= cap) return rate;
  return 0.45;
}

function earnedIncomeCredit(calc, g) {
  let c = calc <= 1.3e6 ? calc * 0.55 : 715000 + (calc - 1.3e6) * 0.3;
  let lim;
  if (g <= 33e6) lim = 740000;
  else if (g <= 70e6) lim = Math.max(740000 - (g - 33e6) * 0.008, 660000);
  else if (g <= 120e6) lim = Math.max(660000 - (g - 70e6) * 0.5, 500000);
  else lim = Math.max(500000 - (g - 120e6) * 0.5, 200000);
  return Math.min(c, lim);
}

function cardDeduction(g, u) {
  const credit = u.credit || 0, check = u.check || 0, market = u.market || 0;
  const culture = g <= 70e6 ? (u.culture || 0) : 0;
  const creditCounted = g <= 70e6 ? credit : credit + (u.culture || 0);
  const total = creditCounted + check + market + culture;
  const threshold = g * 0.25;
  if (total <= threshold) return { deduction: 0, threshold, total, shortfall: threshold - total };
  // 문턱은 공제율 낮은 신용카드부터 채운다
  let rem = threshold, minus = 0;
  for (const [amt, rate] of [[creditCounted, 0.15], [check, 0.3], [culture, 0.3], [market, 0.4]]) {
    const use = Math.min(amt, rem); minus += use * rate; rem -= use;
  }
  const gross = creditCounted * 0.15 + check * 0.3 + culture * 0.3 + market * 0.4 - minus;
  const baseLimit = g <= 70e6 ? 3e6 : 2.5e6;
  const extraLimit = g <= 70e6 ? 3e6 : 2e6;
  const basic = Math.min(gross, baseLimit);
  const extra = Math.min(gross - basic, market * 0.4 + culture * 0.3, extraLimit);
  return { deduction: basic + Math.max(0, extra), threshold, total, shortfall: 0 };
}

// p: 프로필 (원 단위)
function computeTax(p, opts = {}) {
  const annual = p.salary;
  const nontax = Math.min(p.nontaxMonthly || 0, annual / 12) * 12;
  const g = Math.max(0, annual - nontax);                      // 총급여
  const monthly = g / 12;
  const si = socialInsurance(monthly);
  const siYear = { nps: si.nps * 12, health: si.health * 12, ltc: si.ltc * 12, emp: si.emp * 12 };
  const eid = earnedIncomeDeduction(g);
  const eIncome = g - eid;
  const persons = 1 + (p.dependents || 0);
  const basicDed = persons * RULES.basicPerPerson;
  const basic = !!opts.basicOnly;
  const card = basic ? { deduction: 0, threshold: g * 0.25, total: 0, shortfall: 0 } : cardDeduction(g, p.card || {});
  const subOk = !basic && g <= 70e6 && p.noHome && p.householder;
  const subDed = subOk ? Math.min(p.subscription || 0, 3e6) * 0.4 : 0;
  const leaseDed = (!basic && p.noHome && p.householder) ? (p.leaseLoan || 0) * 0.4 : 0;
  const housing = Math.min(subDed + leaseDed, 4e6);
  const taxBase = Math.max(0, eIncome - basicDed - siYear.nps - siYear.health - siYear.ltc - siYear.emp - card.deduction - housing);
  const calcTax = progressiveTax(taxBase);
  // 중소기업 취업 청년 감면 (조특법 30조): 산출세액의 90%, 연 200만원 한도. 근로소득세액공제는 감면비율만큼 줄어든다
  const smeReduce = p.smeYouth ? Math.min(calcTax * 0.9, 2e6) : 0;
  const eic = earnedIncomeCredit(calcTax, g) * (calcTax > 0 ? 1 - smeReduce / calcTax : 1);
  // 세액공제
  const kids = p.kids8 || 0;
  const childCredit = kids <= 0 ? 0 : kids === 1 ? 250000 : kids === 2 ? 550000 : 550000 + (kids - 2) * 400000;
  const pRate = g <= RULES.pension.threshold ? RULES.pension.lowRate : RULES.pension.highRate;
  const pensionEligible = basic ? 0 : Math.min(Math.min(p.pensionSavings || 0, RULES.pension.savingsCap) + (p.irp || 0), RULES.pension.totalCap);
  const pensionCredit = pensionEligible * pRate;
  const rentOk = !basic && p.noHome && g <= 80e6;
  const rentCredit = rentOk ? Math.min(p.rent || 0, 10e6) * (g <= 55e6 ? 0.17 : 0.15) : 0;
  const insCredit = basic ? 0 : Math.min(p.protectInsurance || 0, 1e6) * 0.12;
  const medOver = basic ? 0 : Math.max(0, (p.medical || 0) - g * 0.03);
  const medCredit = Math.min(medOver, 7e6) * 0.15;
  const marriageCredit = basic ? 0 : (p.married2026 ? 500000 : 0);
  const eduCredit = basic ? 0 : (p.education || 0) * 0.15;
  const don = basic ? 0 : (p.donation || 0);
  const donCredit = don <= 1e7 ? don * 0.15 : 1.5e6 + (don - 1e7) * 0.3;
  const ht = basic ? 0 : Math.min(p.hometown || 0, 2e7);
  const htCredit = Math.min(ht, 1e5) * 100 / 110 + Math.max(0, Math.min(ht, 2e5) - 1e5) * 0.4 + Math.max(0, ht - 2e5) * 0.15;
  const special = insCredit + medCredit + eduCredit + donCredit;
  const stdCredit = (special === 0 && housing === 0) ? RULES.standardCredit : 0;
  const credits = eic + childCredit + pensionCredit + rentCredit + special + stdCredit + marriageCredit + htCredit;
  const decided = Math.max(0, Math.floor(calcTax - smeReduce - credits));
  const local = Math.floor(decided * 0.1);
  return {
    gross: g, nontax, monthly, si, siYear, eid, eIncome, basicDed, card, housing, taxBase,
    calcTax, eic, childCredit, pensionCredit, pensionEligible, pRate, rentCredit, insCredit,
    medCredit, marriageCredit, smeReduce, stdCredit, eduCredit, donCredit, htCredit, subDed, leaseDed, decided, local, totalTax: decided + local,
    marginal: marginalRate(taxBase),
  };
}

// 월 실수령액 (원천징수는 기본공제만 반영한 근사치)
function takeHome(p) {
  const bonus = Math.max(0, Math.min(p.bonus || 0, p.salary));
  const reg = p.salary - bonus;                                   // 매달 받는 정기 급여 (연)
  const w = computeTax({ ...p, salary: reg }, { basicOnly: true });
  const monthlyTax = Math.floor(w.totalTax / 12);
  const pay = reg / 12;
  const full = bonus > 0 ? computeTax(p, { basicOnly: true }).totalTax : w.totalTax;
  const bonusTax = Math.max(0, full - w.totalTax);
  const bonusIns = bonus * (RULES.health * (1 + RULES.ltcOfHealth) + RULES.employment);
  return { pay, si: w.si, monthlyTax, net: pay - w.si.total - monthlyTax, withheldYear: monthlyTax * 12 + bonusTax, bonus, bonusNet: bonus - bonusTax - bonusIns, bonusTax, bonusIns };
}

function settlement(p) {
  const t = computeTax(p);
  const th = takeHome(p);
  const withheld = p.withheld > 0 ? p.withheld : th.withheldYear;
  return { t, th, withheld, refund: withheld - t.totalTax, withheldEstimated: !(p.withheld > 0) };
}

// 목표: 현재액 pv, 매월 pmt, 연수익률 r, n년 → 미래가치
function futureValue(pv, pmt, r, years) {
  const i = r / 12, n = Math.round(years * 12);
  if (i === 0) return pv + pmt * n;
  return pv * Math.pow(1 + i, n) + pmt * ((Math.pow(1 + i, n) - 1) / i);
}
function requiredMonthly(target, pv, r, years) {
  const i = r / 12, n = Math.round(years * 12);
  if (n <= 0) return Math.max(0, target - pv);
  const grow = pv * Math.pow(1 + i, n);
  if (i === 0) return Math.max(0, (target - pv) / n);
  return Math.max(0, (target - grow) * i / (Math.pow(1 + i, n) - 1));
}

if (typeof module !== 'undefined') module.exports = { computeTax, takeHome, settlement, futureValue, requiredMonthly, cardDeduction, RULES };

// ===== 상태 =====
const uid = () => Math.random().toString(36).slice(2, 9);
const EXAMPLE = () => ({
  v: 1, example: true,
  profile: { birthYear: 1994, salary: 4800, nontax: 20, dependents: 0, kids8: 0, noHome: true, householder: true, married2026: false, withheld: 0 },
  tax: { credit: 1400, check: 450, market: 80, culture: 40, pensionSavings: 300, irp: 0, subscription: 240, rent: 0, protectInsurance: 70, medical: 30 },
  budget: [
    { id: uid(), group: 'fixed', name: '월세·관리비', amt: 55 },
    { id: uid(), group: 'fixed', name: '통신·구독', amt: 9 },
    { id: uid(), group: 'fixed', name: '교통', amt: 8 },
    { id: uid(), group: 'var', name: '식비', amt: 60 },
    { id: uid(), group: 'var', name: '쇼핑·생활', amt: 30 },
    { id: uid(), group: 'var', name: '여가·경조사', amt: 25 },
    { id: uid(), group: 'save', name: '주택청약', amt: 20 },
    { id: uid(), group: 'save', name: '연금저축', amt: 25 },
    { id: uid(), group: 'save', name: '적금·ETF', amt: 70 },
  ],
  assets: [
    { id: uid(), type: 'cash', name: '파킹통장(비상금)', amt: 600 },
    { id: uid(), type: 'invest', name: 'ISA·ETF', amt: 1500 },
    { id: uid(), type: 'pension', name: '연금저축', amt: 700 },
    { id: uid(), type: 'cash', name: '주택청약', amt: 900 },
    { id: uid(), type: 'debt', name: '전세자금대출', amt: 0 },
  ],
  insurance: [
    { id: uid(), name: '실손의료보험', kind: 'medical', premium: 2.1, cover: 0, renew: '갱신', until: 2100 },
    { id: uid(), name: '건강보험(암·뇌·심장)', kind: 'cancer', premium: 6.5, cover: 3000, renew: '비갱신', until: 2074 },
    { id: uid(), name: '건강보험 뇌혈관 특약', kind: 'brain', premium: 0, cover: 1000, renew: '비갱신', until: 2074 },
  ],
  goals: [
    { id: uid(), name: '내 집 마련 자금', target: 15000, years: 6, current: 2400 },
    { id: uid(), name: '결혼 자금', target: 4000, years: 3, current: 600 },
  ],
  retire: { retireAge: 60, monthly: 50, expense: 250, nps: 110, inflation: 2.5 },
  settings: { ret: 4.5 },
});
const BLANK = () => ({
  v: 1, example: false,
  profile: { birthYear: 1995, salary: 0, nontax: 20, dependents: 0, kids8: 0, noHome: true, householder: false, married2026: false, withheld: 0 },
  tax: { credit: 0, check: 0, market: 0, culture: 0, pensionSavings: 0, irp: 0, subscription: 0, rent: 0, protectInsurance: 0, medical: 0 },
  budget: [], assets: [], insurance: [], goals: [],
  retire: { retireAge: 60, monthly: 0, expense: 250, nps: 100, inflation: 2.5 },
  settings: { ret: 4 },
});
let S = EXAMPLE();
let view = 'home';
let assetsOpen = false;
const ASSET_TYPES = [['cash', '현금·예적금'], ['invest', '투자'], ['pension', '연금계좌'], ['property', '부동산·보증금'], ['right', '분양권·입주권'], ['car', '자동차'], ['etc', '기타 자산'], ['debt', '대출']];
document.addEventListener('toggle', e => { if (e.target.id === 'assetEdit') assetsOpen = e.target.open; }, true);
const TODAY = new Date(2026, 10, 4);
const now = () => { const d = new Date(); return d.getFullYear() >= 2026 ? d : TODAY; };

// ===== 포맷 =====
const W = 10000;
const nf = new Intl.NumberFormat('ko-KR');
const won = v => nf.format(Math.round(v)) + '원';
function man(v) { // 원 → 만원 표기
  const a = Math.abs(v), s = v < 0 ? '−' : '';
  if (a >= 1e8) { const e = Math.floor(a / 1e8), m = Math.round((a % 1e8) / W); return s + e + '억' + (m ? ' ' + nf.format(m) + '만' : '') + '원'; }
  if (a >= W) return s + nf.format(Math.round(a / W)) + '만원';
  return s + nf.format(Math.round(a)) + '원';
}
const pct = (v, d = 0) => (v * 100).toFixed(d) + '%';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const dday = () => { const n = now(); const end = new Date(n.getFullYear(), 11, 31); return Math.max(0, Math.ceil((end - new Date(n.getFullYear(), n.getMonth(), n.getDate())) / 864e5)); };

// ===== 경로 바인딩 =====
function resolve(path) {
  const parts = path.split('.');
  let o = S;
  for (let i = 0; i < parts.length - 1; i++) {
    const p = parts[i];
    if (p.startsWith('@')) o = o.find(x => x.id === p.slice(1)); else o = o[p];
    if (!o) return [null, null];
  }
  return [o, parts.at(-1)];
}
const get = path => { const [o, k] = resolve(path); return o ? o[k] : ''; };
function fld(path, label, unit = '만원', o = {}) {

  const insSave = S.insurance.filter(i => insCat(i) !== 'protect').reduce((a, i) => a + (+i.premium || 0), 0) * W;

  const real = assetSum('right') + assetSum('car') + assetSum('etc');
  const net = cash + invest + pension + property + real - debt;
  const spend = fixed + vari;
  const emergency = spend > 0 ? cash / spend : 0;
  const saveRate = th.net > 0 ? (save + Math.max(0, left)) / th.net : 0;
  const insRate = th.net > 0 ? insPremium / th.net : 0;
  const age = now().getFullYear() - (+S.profile.birthYear || 1990);
  return { pw, st, th, insPremium, insSave, fixed, vari, save, left, cash, invest, pension, property, real, debt, net, spend, emergency, saveRate, insRate, age };

// 국민연금 예상 월액 (오늘 가치). 월액 = Σ(해당 연도 소득대체율 × (A값 + 내 소득) / 2 ÷ 40)
const NPS_A = 3193511; // 2026년 A값
const npsRate = y => y >= 2026 ? 0.43 : y >= 2008 ? 0.50 - 0.005 * (y - 2008) : y >= 1999 ? 0.60 : 0.70;
function npsStartAge(birth) { return birth >= 1969 ? 65 : birth >= 1965 ? 64 : birth >= 1961 ? 63 : birth >= 1957 ? 62 : 61; }
function npsCalc(x) {
  const R = S.retire, Y = now().getFullYear();
  const B = x.pw.salary > 0 ? Math.min(Math.max((x.pw.salary - x.pw.nontaxMonthly * 12) / 12, 410000), 6590000) : 0;
  const past = Math.max(0, Math.min(40, Math.round(+R.npsPast || 0)));
  const stop = Math.min(+R.retireAge || 60, 60);
  let future = Math.max(0, stop - x.age);
  future = Math.min(future, 40 - past);
  let sum = 0;
  for (let i = 1; i <= past; i++) sum += npsRate(Y - i);
  for (let i = 0; i < future; i++) sum += npsRate(Y + i);
  const years = past + future;
  const monthly = years >= 10 ? sum * (NPS_A + B) / 2 / 40 : 0;
  return { A: NPS_A, B, past, future, years, monthly, start: npsStartAge(+S.profile.birthYear || 1990), stop };
}
function retireSim(x) {
  const R = S.retire, r = (+S.settings.ret || 0) / 100, inf = (+R.inflation || 0) / 100;
  const npc = npsCalc(x);
  if (R.npsAuto) R.nps = Math.round(npc.monthly / W);

  const pts = []; let gone = null;

    const yrs = age - A;
    if (age < R.retireAge) { const yr = now().getFullYear() + yrs; const start = +R.startYear || now().getFullYear(); bal = bal * (1 + r) + (yr >= start ? (+R.monthly || 0) * 12 : 0); }

      const need = ((+R.expense || 0) - (age >= npc.start ? (+R.nps || 0) : 0) - ann) * 12 * Math.pow(1 + inf, yrs);
      bal = bal * (1 + r) - Math.max(0, need);
    }
    if (bal < 0) { if (gone === null) gone = age + 1; bal = 0; }
  }
  return { pts, gone };
}
function lineChart(pts, retireAge, gone) {
  const w = 380, h = 220, l = 44, rgt = 12, t = 16, b = 28;

  const x0 = xs[0], x1 = xs.at(-1), yMax = Math.max(...ys, 1);
  const step = [1000, 2000, 5000, 10000, 20000, 50000, 100000, 200000].find(s => yMax / s <= 5) || 500000;
  const top = Math.ceil(yMax / step) * step;
  const X = v => l + (v - x0) / (x1 - x0 || 1) * (w - l - rgt), Y = v => t + (1 - v / top) * (h - t - b);
  const ticks = []; for (let v = 0; v <= top; v += step) ticks.push(v);

  const line = pts.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join('');
  const area = line + `L${X(x1)} ${Y(0)}L${X(x0)} ${Y(0)}Z`;
  const decades = []; for (let a = Math.ceil(x0 / 10) * 10; a <= x1; a += 10) decades.push(a);
  const peak = pts.reduce((m, p) => p[1] > m[1] ? p : m, pts[0]);

    ${ticks.map(v => `<line x1="${l}" x2="${w - rgt}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${l - 8}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--f-num)">${fmt(v)}</text>`).join('')}
    ${decades.map(a => `<text x="${X(a)}" y="${h - 10}" text-anchor="middle" font-size="11" fill="var(--muted)">${a}세</text>`).join('')}
    ${retireAge > x0 && retireAge < x1 ? `<line x1="${X(retireAge)}" x2="${X(retireAge)}" y1="${t}" y2="${h - b}" stroke="var(--muted)" stroke-dasharray="4 4"/><text x="${X(retireAge) + 6}" y="${t + 12}" font-size="11" fill="var(--muted)">은퇴 ${retireAge}세</text>` : ''}
    <path d="${area}" fill="var(--accent)" fill-opacity="0.12"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="${X(peak[0])}" cy="${Y(peak[1])}" r="4" fill="var(--accent)"/>
    ${gone ? `<circle cx="${X(Math.min(gone, x1))}" cy="${Y(0)}" r="5" fill="var(--crit)"/>` : ''}
  </svg>`;
}

  const yrs = []; for (let y = Math.ceil(x0 / 5) * 5; y <= x1; y += 5) yrs.push(y);
  const marks = b.filter(p => p.notes.length);
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="연도별 순자산, 이벤트 반영 전후 비교">
    ${ticks.map(v => `<line x1="${l}" x2="${w - rgt}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"${v === 0 ? ' stroke-width="1.5"' : ''}/><text x="${l - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="10.5" fill="var(--muted)" font-family="var(--f-num)">${fmt(v)}</text>`).join('')}
    ${yrs.map(y => `<text x="${X(y)}" y="${h - 9}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${y}</text>`).join('')}
    <path d="${path(a)}" fill="none" stroke="var(--muted)" stroke-width="1.75" stroke-dasharray="5 4"/>
    <path d="${path(b)}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    ${marks.map(p => `<circle cx="${X(p.y)}" cy="${Y(p.net / W)}" r="4" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>`).join('')}
  </svg>`;
}
function eventNotes(e, x) {
  const n = [];
  if (e.type === 'marriage') {
    n.push(['info', `둘이 합친 월 실수령 약 ${man(x.th.net + takeHome(pwWith((+e.partner || 0) * W)).net)}`]);
    if (+e.year <= 2026) n.push(['good', '2026년 혼인신고까지 결혼세액공제 1인 50만원']);
    else n.push(['warn', '결혼세액공제는 2026년 혼인신고분까지. 이후는 재정지원 전환이 개편안에 담겨 있어요(국회 심의 중)']);
    n.push(['info', '청약 소득공제 배우자까지 · 신혼 특공 확인']);
  }
  if (e.type === 'baby') {
    const order = S.events.filter(v => v.type === 'baby' && (+v.year < +e.year || (v.year === e.year && S.events.indexOf(v) <= S.events.indexOf(e)))).length;
    const s = babySupport(order);
    const lm = Math.min(12, +e.leave || 0), lb = leaveBenefit(x.pw.salary / 12, lm);
    n.push(['good', `받는 지원(현행): 첫만남이용권 ${man(s.first)} · 부모급여 0세 월 100만·1세 월 50만 · 아동수당 월 10만(9세 미만)`]);
    if (lm) n.push(['info', `육아휴직 ${lm}개월 급여 약 ${man(lb)} (월 상한 1~3개월 250만, 4~6개월 200만, 7개월~ 160만)`]);
    n.push(['warn', `출산세액공제 ${man(s.credit)} · 개편안은 지원금으로 전환`]);
  }
  if (e.type === 'home') {
    const sim = simulate(true).find(p => p.y === +e.year);
    const inc = sim ? sim.income : x.pw.salary;
    const L = loanLimit(Math.max(x.pw.salary, inc * 1.2), (+e.price || 0) * W, { metro: S.homeCalc.metro, first: S.homeCalc.first, rate: +e.rate || 4, years: 30 });
    const need = (+e.price || 0) * W - (+e.loan || 0) * W;
    n.push([(+e.loan || 0) * W > L.limit ? 'crit' : 'good', `대출 ${man((+e.loan || 0) * W)} · 예상 한도 ${man(L.limit)} (${L.by} 기준)`]);
    n.push(['info', `자기자본 ${man(need)} + 취득세 약 ${man((+e.price || 0) * W * acqTaxRate((+e.price || 0) * W))}, 월 상환 약 ${man(annuityPayment((+e.loan || 0) * W, +e.rate || 0, 30))}`]);
  }
  if (e.type === 'job') {
    const now2 = x.th.net, nw = takeHome(pwWith((+e.salary || 0) * W)).net;
    n.push([nw >= now2 ? 'good' : 'warn', `월 실수령 ${man(now2)} → ${man(nw)} (${nw >= now2 ? '+' : ''}${man(nw - now2)})`]);
    n.push(['info', '퇴직금은 1년 이상 근무 시 근속연수 × 월평균임금. 이직 전 IRP로 받으면 퇴직소득세 이연']);
  }
  if (e.type === 'gap') n.push(['warn', `소득 공백 약 ${man(x.th.net * Math.min(12, +e.months || 0))}. 비상금 ${x.emergency.toFixed(1)}개월치로 버틸 수 있는지 확인`]);
  if (e.type === 'big') n.push(['info', `저축 계획 기준 약 ${Math.ceil(((+e.amount || 0) * W) / Math.max(x.save + Math.max(0, x.left), 1))}개월치 저축`]);
  return n;
}

// ---------- 정책대출 비교 ----------
function policyLoans(x) {
  const H = S.homeCalc, price = (+H.price || 0) * W, metro = !!H.metro, first = !!H.first;
  const partner = (+H.partner || 0) * W;
  const income = x.pw.salary + partner;
  const ltvGen = (fst) => metro ? 0.7 : (fst ? 0.8 : 0.7);
  const dti = r => annuityPV(income * 0.6 / 12, r, 30);
  const list = [];
  // 신생아 특례
  { const okInc = partner > 0 ? income <= 2e8 && Math.max(x.pw.salary, partner) <= 1.3e8 : income <= 1.3e8;
    const ok = !!H.baby && okInc && price <= 9e8;
    const lim = Math.min(4e8, price * ltvGen(first), dti(3.0));
    list.push({ key: 'baby', name: '신생아 특례 디딤돌', ok, limit: lim, rateText: '1.8~4.5% 고정', rateShown: '약 3.0', rateCalc: 3.0, rule: 'DSR 제외 · DTI 60% · 최대 4억', why: !H.baby ? '2년 내 출산·입양 가구만' : !okInc ? '소득 1.3억(맞벌이 2억) 초과' : '집값 9억 초과', pri: 0 }); }
  // 청년 주택드림 디딤돌
  { const age = x.age, incCap = H.newly ? 1e8 : 7e7, cap = H.newly ? 4e8 : 3e8;
    const ok = age <= 39 && !!H.dream && income <= incCap && price <= 6e8;
    const lim = Math.min(cap, price * ltvGen(first), dti(2.8));
    list.push({ key: 'dream', name: '청년 주택드림 디딤돌', ok, limit: lim, rateText: '2.40~4.15% (결혼·출산 우대 시 최저 1.5%)', rateShown: '약 2.8', rateCalc: 2.8, rule: `DSR 제외 · DTI 60% · 최대 ${man(cap)} · 청약 당첨 분양주택만`, why: age > 39 ? '청약 당첨 시 만 39세 이하만' : !H.dream ? '청년주택드림 청약통장(1년·1천만원 이상 납입)으로 분양 당첨 시에만' : income > incCap ? `소득 ${man(incCap)} 초과` : '분양가 6억 초과', pri: 0.5 }); }
  // 디딤돌
  { const incCap = H.newly ? 8.5e7 : first ? 7e7 : 6e7, priceCap = H.newly ? 6e8 : 5e8, cap = H.newly ? 4e8 : first ? 3e8 : 2.5e8;
    const ok = income <= incCap && price <= priceCap;
    const lim = Math.min(cap, price * ltvGen(first), dti(3.3));
    list.push({ key: 'didim', name: '디딤돌 대출', ok, limit: lim, rateText: '2.65~3.95%', rateShown: '약 3.3', rateCalc: 3.3, rule: `DSR 제외 · DTI 60% · 최대 ${man(cap)}${metro ? ' · 수도권 아파트는 방공제로 한도 감소' : ''}`, why: income > incCap ? `소득 ${man(incCap)} 초과` : `집값 ${man(priceCap)} 초과`, pri: 1 }); }
  // 보금자리론
  { const incCap = H.newly ? 8.5e7 : 7e7, cap = first ? 4.2e8 : 3.6e8;
    const ok = income <= incCap && price <= 6e8;
    const lim = Math.min(cap, price * ltvGen(first), dti(4.3));
    list.push({ key: 'bogeum', name: '보금자리론', ok, limit: lim, rateText: '4%대 고정', rateShown: '약 4.3', rateCalc: 4.3, rule: `DSR 제외 · DTI 60% · 최대 ${man(cap)} · 순자산 심사 없음`, why: income > incCap ? `소득 ${man(incCap)} 초과` : '집값 6억 초과', pri: 2 }); }
  // 은행 주담대
  { const L = loanLimit(income, price, { metro, first, rate: +H.rate || 4, years: 30 });
    list.push({ key: 'bank', name: '은행 주택담보대출', ok: price > 0, limit: L.limit, rateText: `${H.rate || 4}% 가정`, rateShown: String(H.rate || 4), rateCalc: +H.rate || 4, rule: `DSR 40%${metro ? '·스트레스 +3%p' : ''} · LTV ${pct(L.ltvRate)}${isFinite(L.cap) ? ` · 상한 ${man(L.cap)}` : ''} (${L.by} 기준)`, why: '', pri: 3 }); }
  const need = Math.max(0, price - (x.cash + x.invest));
  const elig = list.filter(o => o.ok && o.limit > 0);
  // 필요한 만큼 되는 것 중 금리 낮은 것, 없으면 한도 큰 것
  const enough = elig.filter(o => o.limit >= need * 0.95).sort((a, b) => a.pri - b.pri);
  const best = enough[0] || elig.sort((a, b) => b.limit - a.limit)[0] || null;
  const picked = H.pick ? list.find(o => o.key === H.pick && o.ok && o.limit > 0) : null;
  return { list, best, income, picked, chosen: picked || best };
}

      <div class="rows" id="homeOut"></div><div class="stack" id="loanCmp"></div>

function judge(x) {
  const b = S.buy, price = (+b.price || 0) * W, months = Math.max(1, +b.months || 1), upkeep = (+b.upkeep || 0) * W;
  const hourly = x.th.net / 209;
  const hours = hourly > 0 ? price / hourly : 0;
  const perMonth = price / months + upkeep;
  const surplus = Math.max(0, x.left);
  const cashAfter = months === 1 ? x.cash - price : x.cash;
  const emAfter = x.spend > 0 ? cashAfter / x.spend : 0;
  const saveFlow = x.save + surplus;
  const delayM = saveFlow > 0 ? price / saveFlow : Infinity;
  const yrs = Math.max(0, (+S.retire.retireAge || 60) - x.age);
  const retireCost = price * Math.pow(1 + (+S.settings.ret || 0) / 100, yrs) + upkeep * 12 * ((Math.pow(1 + (+S.settings.ret || 0) / 100, yrs) - 1) / Math.max(1e-9, (+S.settings.ret || 0) / 100));
  let v, why;
  if (price <= 0) { v = 'info'; why = '가격을 넣어주세요.'; }
  else if (perMonth <= surplus * 0.5 && emAfter >= 3) { v = 'good'; why = '이번 달 남는 돈 안에서 해결돼요. 계획에 지장이 없어요.'; }
  else if (months > 1 && perMonth > surplus) { v = 'crit'; why = `할부 월 ${man(perMonth)}이 매달 남는 돈 ${man(surplus)}보다 많아요. 저축을 깎거나 빚이 생겨요.`; }
  else if (emAfter >= 3 && delayM <= 3) { v = 'warn'; why = `살 수는 있지만 목표가 약 ${delayM.toFixed(1)}개월 늦어져요. 72시간 뒤에도 갖고 싶으면 사세요.`; }
  else if (emAfter < 3) { v = 'crit'; why = `사고 나면 비상금이 생활비 ${Math.max(0, emAfter).toFixed(1)}개월치로 줄어요. 3개월 아래는 위험해요.`; }
  else { v = 'warn'; why = `저축 ${delayM.toFixed(1)}개월치예요. 목표 일정이 그만큼 밀려요.`; }
  return { v, why, hours, perMonth, emAfter, delayM, retireCost, upkeepYear: upkeep * 12 };
}

function focusKey(k, x) {
  const r = (+S.settings.ret || 0) / 100, ms = x.save + Math.max(0, x.left), liq = x.cash + x.invest + x.pension;
  const mt = t => { if (liq >= t) return 0; for (let m = 1; m <= 600; m++) if (futureValue(liq, ms, r, m / 12) >= t) return m; return null; };
  const yy = m => m === null ? '50년+' : m === 0 ? '달성' : `${now().getFullYear() + Math.floor((now().getMonth() + m) / 12)}년`;
  switch (k) {
    case 'starter': return ['첫 1억 도달', yy(mt(1e8))];
    case 'marriage': { const ev = S.events.find(e => e.type === 'marriage'); return ev ? ['둘이 합친 월 실수령', man(x.th.net + takeHome(pwWith((+ev.partner || 0) * W)).net)] : ['결혼세액공제 마감', `D-${dday()}`]; }
    case 'baby': { const s = babySupport(1); return ['0~8세 받는 지원금', man(s.first + s.parent0 + s.parent1 + s.child)]; }
    case 'home': { const h = S.homeCalc, pr = (+h.price || 0) * W; const bl = policyLoans(x).chosen; const nd = pr - (bl ? bl.limit : 0) + pr * acqTaxRate(pr); return ['필요한 내 돈', `${man(nd)} · ${yy(mt(nd))}`]; }
    case 'job': { const t2 = takeHome(pwWith(x.pw.salary + 500 * W)); return ['연봉 +500만 시 월', '+' + man(t2.net - x.th.net)]; }
    case 'invest': return ['연금계좌 채움', `${nf.format(Math.min(900, S.tax.pensionSavings + S.tax.irp))} / 900만`];
    case 'debt': return ['남은 부채', man(x.debt)];
    case 'retire': { const sim = retireSim(x); return ['노후 자금', sim.gone ? `${sim.gone}세 소진` : '95세까지']; }
  }
  return ['', ''];
}

readHometax = async function () {
  const text = (document.getElementById('htPaste') || {}).value || '', files = _raw.htImg || [];
  const annual = (document.getElementById('htAnnual') || {}).checked;
  if (!text.trim() && !files.length) { htDraft = { error: '미리보기 내용을 붙여넣거나 화면 캡처를 첨부해 주세요.' }; renderHt(); return; }
  htBusy = true; htDraft = null; renderHt();
  try {
    const hs = (await readLocal(files, text, 'hometax', () => { })).map(r => r.hometax || {});
    const d = {}; hs.forEach(h => Object.entries(h).forEach(([k, v]) => { if (k === 'months') d.months = Math.min(d.months || 12, v); else d[k] = (d[k] || 0) + v; }));
    const months = d.months || 12, scale = annual && months < 12 ? 12 / months : 1;
    const rows = HT_FIELDS.map(([k, label]) => [k, label, Math.round((d[k] || 0) * scale * 10) / 10]).filter(r => r[2] > 0);
    htDraft = rows.length ? { rows, months, scale, notes: '사진에서 읽은 값이라 틀릴 수 있어요. 확인 후 적용하세요.' } : { error: '금액을 찾지 못했어요. 항목명과 금액이 보이게 다시 넣어주세요.' };
  } catch (e) { htDraft = { error: e && e.code === 'ocr_load' ? OCR_FAIL : '읽는 중 문제가 생겼어요.' }; }
  htBusy = false; renderHt();
};
// 캡처 시트 문구 + 읽은 결과 고칠 수 있게 안내
const _capSheetW = capSheet;
capSheet = function () {
  _capSheetW();
  const p = document.querySelector('.sheet .note');
  if (p) p.innerHTML = '토스·카카오페이·뱅크샐러드 자산 화면, 보험 보장 내역, 홈택스 미리보기, 급여명세서 캡처를 <b>섞어서 한꺼번에</b> 올려도 돼요. 사진은 밖으로 보내지 않고 <b>이 폰 안에서</b> 글자를 읽어요. 처음 한 번은 준비하느라 30초쯤 걸려요.';
};
const _renderCapW = renderCap;
renderCap = function () {
  _renderCapW();
  const box = document.getElementById('capBox');
  if (box && capDraft && !capDraft.error && !box.querySelector('.ocrnote')) box.insertAdjacentHTML('afterbegin', '<p class="note ocrnote">사진에서 읽은 값이라 틀릴 수 있어요. 이상한 건 체크를 빼고, 채운 뒤 각 탭에서 고치면 돼요.</p>');
};

// 읽은 이름을 그 자리에서 고칠 수 있게
const _renderCapW2 = renderCap;
renderCap = function () {
  _renderCapW2();
  if (!capDraft || capDraft.error) return;
  (capDraft.assets || []).forEach((a, k) => {
    const cb = document.querySelector(`[data-cap="a${k}"]`); if (!cb) return;
    const b = cb.parentElement.querySelector('b'); if (!b) return;
    const inp = document.createElement('input'); inp.type = 'text'; inp.className = 'capname'; inp.value = a.name; inp.placeholder = '이름 적기'; inp.dataset.capname = k;
    inp.addEventListener('click', e => e.preventDefault());
    inp.addEventListener('input', () => { capDraft.assets[k].name = inp.value; if (inp.value.trim()) cb.checked = true; });
    b.replaceWith(inp);
    if (a.sus && !a.name) cb.checked = false;
  });
};
const _applyCapW = applyCap;
applyCap = function () { (capDraft && capDraft.assets || []).forEach(a => { a.name = (a.name || '').trim() || '이름 없는 자산'; delete a.sus; }); _applyCapW(); };

try { const v = localStorage.getItem('fp-view'); if (v && views[v]) view = v; } catch (e) { }
initStore();

</script>
